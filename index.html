<style>
/* Layout: floating pill nav with sliding indicator, one FAB opening bottom sheets, big blue hero card. Every state change animates. */
:root{
  --bg:#F1F3F9; --surface:#FFFFFF; --ink:#0D1226; --muted:#6A7189; --line:#E3E7F0;
  --accent:#2D5BFF; --accent-text:var(--accent); --accent-ink:#FFFFFF; --soft:#E6ECFF; --bar:#C9D5FF;
  --hero:#2D5BFF; --hero-ink:#FFFFFF; --hot:#F2552C; --ok:#12A579; --track:#E6EAF3;
  --sh:0 4px 12px -8px rgba(26,40,110,.35); --scrim:rgba(8,12,28,.45);
  --f-display:"Rubik","Tajawal",system-ui,sans-serif;
  --f-body:"Tajawal","Rubik",system-ui,sans-serif;
  --ease:cubic-bezier(.22,.9,.28,1); --spring:cubic-bezier(.3,1.35,.5,1); --w:560px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0E1C; --surface:#131A2E; --ink:#EEF1FA; --muted:#8E97B3; --line:#222B45;
  --accent:#7C98FF; --accent-ink:#0A0E1C; --soft:#1B2650; --bar:#2B3A78;
  --hero:#2F49C7; --hero-ink:#FFFFFF; --hot:#FF8A5E; --ok:#3DD6A3; --track:#222B45;
  --sh:none; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0E1C; --surface:#131A2E; --ink:#EEF1FA; --muted:#8E97B3; --line:#222B45;
  --accent:#7C98FF; --accent-ink:#0A0E1C; --soft:#1B2650; --bar:#2B3A78;
  --hero:#2F49C7; --hero-ink:#FFFFFF; --hot:#FF8A5E; --ok:#3DD6A3; --track:#222B45;
  --sh:none; --scrim:rgba(0,0,0,.6); color-scheme:dark}
/* ===== custom theme: colours come from ThemeManager palettes (--t-* set on <html>) ===== */
:root[data-theme="custom"]{
  --bg:var(--t-bg); --surface:var(--t-surface); --ink:var(--t-text); --muted:var(--t-muted); --line:var(--t-border);
  --field:var(--t-input); --secondary:var(--t-secondary);
  --accent:var(--t-primary); --accent-text:var(--t-primary-text); --accent-ink:var(--t-on-primary);
  --soft:color-mix(in srgb,var(--t-primary) 20%,var(--t-surface));
  --bar:color-mix(in srgb,var(--t-secondary) 62%,var(--t-surface));
  --track:color-mix(in srgb,var(--t-border) 62%,var(--t-bg));
  --hero:var(--t-primary); --hero-ink:var(--t-on-primary); --hot:#FF8A5E; --ok:#3DD6A3;
  --c-hover:color-mix(in srgb,var(--t-primary) 84%,#fff);
  --c-pressed:color-mix(in srgb,var(--t-primary) 80%,#000);
  --c-surface-hover:color-mix(in srgb,var(--t-surface) 82%,var(--t-secondary));
  --c-surface-pressed:color-mix(in srgb,var(--t-surface) 72%,var(--t-secondary));
  --c-disabled-bg:color-mix(in srgb,var(--t-input) 70%,var(--t-bg));
  --c-disabled-ink:color-mix(in srgb,var(--t-muted) 55%,var(--t-input));
  --c-selected-bg:var(--soft); --c-selected-border:var(--t-primary); --c-focus:var(--t-secondary);
  --sh:none; --scrim:rgba(0,0,0,.6); color-scheme:dark}
:root[data-theme="custom"][data-tone="light"]{color-scheme:light;--sh:0 10px 28px -16px rgba(40,30,20,.35);--scrim:rgba(20,14,10,.45);--hot:#D9531E;--ok:#12805A;--c-hover:color-mix(in srgb,var(--t-primary) 88%,#000)}
:root[data-theme="custom"] input::placeholder{color:var(--t-muted);opacity:.8}
:root[data-theme="custom"] :is(input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=password],select,.pk){border-color:var(--t-border)}
:root[data-theme="custom"] :is(input,select,.pk):focus,:root[data-theme="custom"] .pk:focus-visible{border-color:var(--t-primary)}
:root[data-theme="custom"] :focus-visible{outline:2px solid var(--c-focus);outline-offset:2px}
:root[data-theme="custom"] .link{color:var(--secondary)}
:root[data-theme="custom"] .plan .link{color:var(--hero-ink)!important}
:root[data-theme="custom"] .hero .go{background:var(--t-on-primary);color:var(--t-primary)}
:root[data-theme="custom"] :is(.rb,.cb:not(.main),.lay button,.fsz button,.pk) svg{color:var(--secondary)}
:root[data-theme="custom"] .lay button[aria-pressed=true] svg{color:var(--t-primary)}
:root[data-theme="custom"] :is(.chip,.lay button)[aria-pressed=true],:root[data-theme="custom"] .pkopt[aria-checked=true]{background:var(--c-selected-bg);border-color:var(--c-selected-border)}
:root[data-theme="custom"] .dd button[aria-selected=true]{background:var(--c-selected-bg)}
@media (hover:hover){
  :root[data-theme="custom"] :is(.btn,.cb.main):hover:not(:disabled){background:var(--c-hover);filter:none}
  :root[data-theme="custom"] :is(.btn.ghost,.btn.out,.rb,.cb:not(.main),.chip,.lay button,.fsz button,.pkopt,.dd button,.pk):hover:not(:disabled){background:var(--c-surface-hover)}
  :root[data-theme="custom"] .nav button:hover{color:var(--t-primary)}
}
:root[data-theme="custom"] :is(.btn,.cb.main):active:not(:disabled){background:var(--c-pressed);filter:none}
:root[data-theme="custom"] :is(.btn.ghost,.btn.out,.rb,.cb:not(.main),.chip,.lay button,.fsz button,.pkopt,.dd button,.pk):active:not(:disabled){background:var(--c-surface-pressed)}
:root[data-theme="custom"] :is(.btn,.cb,.rb,.chip,.lay button,.fsz button,input,select,.pk):disabled{background:var(--c-disabled-bg);color:var(--c-disabled-ink);border-color:transparent;box-shadow:none;cursor:not-allowed}
/* palette picker + live preview cards (settings) */
.pvgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pv{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:18px;border:1.5px solid var(--pv-bd);background:var(--pv-bg);color:var(--pv-tx);text-align:start;font-weight:700;font-size:calc(13px*var(--fs,1))}
.pv .pvc{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:12px;background:var(--pv-sf);border:1px solid var(--pv-bd)}
.pv .pvl{height:6px;width:70%;border-radius:3px;background:var(--pv-tx)}
.pv .pvl.m{width:48%;background:var(--pv-mt)}
.pv .pvi{height:14px;border-radius:7px;background:var(--pv-in);border:1px solid var(--pv-bd)}
.pv .pvr{display:flex;align-items:center;gap:6px}
.pv .pvb{height:14px;flex:1;border-radius:7px;background:var(--pv-pr)}
.pv .pvs{width:14px;height:14px;border-radius:50%;background:var(--pv-sc)}
.pv[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
select.thsel{border-color:var(--line);font-weight:700}
.pksheet .pvgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pksheet .pv{padding:6px;gap:5px;border-radius:14px;font-size:calc(11.5px*var(--fs,1));line-height:1.25}
.pksheet .pv .pvc{padding:5px;gap:4px;border-radius:9px}
.pksheet .pv .pvl{height:4px}.pksheet .pv .pvi,.pksheet .pv .pvb,.pksheet .pv .pvs{height:10px}.pksheet .pv .pvs{width:10px}
.thbtn{display:flex;align-items:center;gap:12px;width:100%;font-weight:700;text-align:start}
.thdots{display:inline-flex;flex:none}.thdots i{width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);margin-inline-end:-6px}
.thcur{flex:1;min-width:0}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:calc(16px*var(--fs,1));line-height:1.5;
  padding-block:0 136px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:background .35s,color .35s}
.wrap{width:100%;min-width:0;max-width:var(--w);margin-inline:auto;display:flex;flex-direction:column;gap:16px;padding-top:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:600}
button,input,select{font:inherit;color:inherit;touch-action:manipulation}
input,select,textarea{font-size:max(16px,calc(16px*var(--fs,1)))}
.fsz{direction:ltr;display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center}
.fsz button{height:48px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;display:grid;place-items:center}
.fsz button:disabled{opacity:.35}
.fsz .fl2{text-align:center;font-weight:700;font-size:calc(15px*var(--fs,1))}
.fsz .fl2 small{display:block;color:var(--muted);font-weight:500;font-size:calc(12px*var(--fs,1))}
.auth .link.fg{align-self:flex-start;padding:2px 0}
.auth .err.ok{color:var(--ok)}
[tabindex="-1"]:focus{outline:none}
.cscrim{position:fixed;inset:0;z-index:80;background:var(--scrim);opacity:0;transition:opacity .25s}
.cscrim.in{opacity:1}
.cdlg{position:fixed;z-index:81;inset-inline:20px;top:50%;max-width:400px;margin-inline:auto;padding:24px 22px 20px;border-radius:28px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);box-shadow:0 24px 60px -18px rgba(8,12,28,.6);opacity:0;transform:translateY(-46%) scale(.96);transition:opacity .22s var(--ease),transform .3s var(--spring)}
.cdlg.in{opacity:1;transform:translateY(-50%)}
.cdlg h2{font-size:calc(19px*var(--fs,1));margin-bottom:8px}
.cdlg p{margin:0 0 20px;color:var(--muted);font-size:calc(15px*var(--fs,1));line-height:1.6}
.cdlg .cbt{display:flex;gap:10px}
.cdlg .cbt .btn{flex:1;height:48px;font-size:calc(15px*var(--fs,1));padding-inline:12px}
.cdlg .btn.danger{background:var(--hot);color:#fff}
@media (prefers-reduced-motion:reduce){.cscrim,.cdlg{transition:none}}

/* themed dropdown (replaces the native select popup) */
.ddscrim{position:fixed;inset:0;z-index:60;background:transparent}
.dd{position:fixed;z-index:61;min-width:160px;max-height:min(56vh,420px);overflow:auto;overscroll-behavior:contain;padding:6px;
  background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:20px;box-shadow:0 18px 44px -14px rgba(8,12,28,.55);
  opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top center;transition:opacity .18s var(--ease),transform .22s var(--spring)}
.dd.up{transform-origin:bottom center;transform:translateY(6px) scale(.97)}
.dd.in{opacity:1;transform:none}
.dd .dt{padding:8px 12px 6px;font-size:calc(12px*var(--fs,1));color:var(--muted);font-weight:700;letter-spacing:.02em}
.dd button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:46px;padding:8px 12px;border:0;border-radius:14px;background:transparent;
  color:var(--ink);font-weight:600;font-size:calc(15px*var(--fs,1));text-align:start}
.dd button:active{background:var(--soft)}
.dd button .rd{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:border-color .2s,background .2s}
.dd button[aria-selected=true]{background:var(--soft);color:var(--accent-text)}
.dd button[aria-selected=true] .rd{border-color:var(--accent)}
.dd button[aria-selected=true] .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.dd button+button{margin-top:2px}
@media (prefers-reduced-motion:reduce){.dd{transition:none}}

button{cursor:pointer;transition:transform .18s var(--ease),background .25s,color .25s,opacity .25s}
button:active{transform:scale(.95)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.ic{display:block;flex:none}

/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hdr .tcol{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.hdr .clk{color:var(--muted);font-size:calc(12.5px*var(--fs,1));line-height:1.2;white-space:nowrap;font-variant-numeric:tabular-nums}
.hdr small{display:block;color:var(--muted);font-size:calc(12.5px*var(--fs,1));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr h1{font-size:calc(20px*var(--fs,1));font-weight:700;line-height:1.25;margin-top:1px;letter-spacing:-.01em;white-space:normal;overflow:visible;overflow-wrap:anywhere;text-wrap:pretty}
.hdr p{margin:4px 0 0;color:var(--muted);font-size:calc(14px*var(--fs,1))}
.tools{display:flex;gap:8px;flex:none}
.rb{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-weight:600;font-size:calc(13px*var(--fs,1));box-shadow:var(--sh)}
.mini{align-self:flex-start;display:flex;align-items:center;gap:8px;border:0;border-radius:99px;background:var(--accent);color:var(--accent-ink);padding:8px 14px 8px 12px;font-weight:600;font-size:calc(14px*var(--fs,1));animation:drop .4s var(--spring)}
.mini[hidden]{display:none}

/* entrance */
.rise{opacity:1}
.enter .rise{animation:rise .3s var(--ease) both;animation-delay:calc(var(--d,0) * 25ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-8px) scale(.9)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes out{to{opacity:0;transform:translateX(24px);max-height:0;padding-block:0}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--sh)}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh h2{font-size:calc(17px*var(--fs,1))}
.link{border:0;background:none;color:var(--accent-text);font-weight:700;font-size:calc(14px*var(--fs,1));padding:6px 2px}
.muted{color:var(--muted)}
.small{font-size:calc(13px*var(--fs,1))}
.row{display:flex;gap:10px;align-items:center;min-width:0}
.grow{flex:1;min-width:0}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border:0;overflow:hidden;position:relative;flex-direction:row;align-items:center;gap:16px;padding:22px;border-radius:30px}
.hero::after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,0) 68%);inset-block-start:-90px;inset-inline-end:-60px;pointer-events:none}
.hero .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.hero .lbl{font-size:calc(14px*var(--fs,1));opacity:.82;font-weight:500}
.hero .big{font-family:var(--f-display);font-size:calc(52px*var(--fs,1));font-weight:700;line-height:1;letter-spacing:-.03em}
.hero .of{font-size:calc(14px*var(--fs,1));opacity:.82}
.hero .go{margin-top:8px;align-self:flex-start;border:0;border-radius:99px;background:#fff;color:#1A36C9;font-weight:700;height:44px;padding-inline:18px;display:flex;align-items:center;gap:8px}
.ring{position:relative;flex:none;width:118px;height:118px;z-index:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:calc(22px*var(--fs,1));font-weight:600}
.ring circle.p{transition:stroke-dashoffset 1s var(--ease)}

/* scroller + subject tiles */
.scroller{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;margin-inline:-2px;padding-inline:2px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.tile{flex:none;scroll-snap-align:start;width:148px;border:0;text-align:start;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;
  background:color-mix(in srgb,var(--c) 15%,var(--surface));min-width:0}
.tile .pl{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.tile b{font-weight:600;overflow-wrap:anywhere;line-height:1.25}
.tile span{font-size:calc(12px*var(--fs,1));color:var(--muted)}

.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .9s var(--ease)}

/* tasks */
.grp{display:flex;flex-direction:column}
.gh{display:flex;align-items:center;gap:8px;font-size:calc(12px*var(--fs,1));font-weight:700;color:var(--muted);letter-spacing:.04em;padding-bottom:4px}
.gh.late{color:var(--hot)}
.gh em{font-style:normal;background:var(--track);border-radius:99px;padding:0 8px;font-weight:600}
.trow{display:flex;gap:12px;align-items:center;padding-block:11px;border-top:1px solid var(--line);overflow:hidden;max-height:120px;transition:opacity .3s}
.trow:first-of-type{border-top:0}
.trow.out{animation:out .26s var(--ease) forwards}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0;color:transparent;transition:background .25s,border-color .25s,color .25s,transform .18s}
.chk.pop{animation:pop .4s var(--spring)}
.trow.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.ttl{font-weight:500;overflow-wrap:anywhere;transition:color .3s}
.trow.done .ttl{color:var(--muted);text-decoration:line-through}
.trow.done{opacity:.7}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:calc(12.5px*var(--fs,1));color:var(--muted);align-items:center;margin-top:2px}
.sp{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:1px 10px 1px 8px;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--ink);font-weight:500}
.sp i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.late{color:var(--hot);font-weight:700}
.pri{color:var(--hot);font-weight:700}
.x{flex:none;border:0;background:none;color:var(--muted);width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.x:hover{background:var(--track)}
.empty{color:var(--muted);text-align:center;padding:18px 0;font-size:calc(14px*var(--fs,1))}

/* task search + filters */
.sbox{position:relative;display:flex;align-items:center}
.sbox>svg{position:absolute;inset-inline-start:16px;color:var(--muted);pointer-events:none}
.sbox input[type=text]{padding-inline:44px;background:var(--surface);border-color:var(--line)}
.sbox input[type=text]:focus{border-color:var(--accent)}
.sbox input::-webkit-search-cancel-button{display:none}
.sbox .sx{position:absolute;inset-inline-end:6px;width:38px;height:38px;border:0;border-radius:50%;background:none;color:var(--muted);display:grid;place-items:center}
.sbox .sx[hidden]{display:none}
.frow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.frow select{height:42px;padding-inline:10px;border-radius:14px;font-size:calc(13.5px*var(--fs,1));background:var(--surface);border-color:var(--line);text-overflow:ellipsis}
.frow select.on{border-color:var(--accent);background:var(--soft)}
.fclr{align-self:flex-start}
.fclr[hidden]{display:none}

.tbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;height:38px;padding-inline:14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:calc(13.5px*var(--fs,1));color:var(--muted)}
.chip[aria-pressed=true]{background:var(--soft);border-color:var(--accent);color:var(--accent-text)}
.trow.ord{gap:6px}
.rord{flex:none;display:flex;align-items:center}
.grip{width:32px;height:40px;border:0;background:none;color:var(--muted);display:grid;place-items:center;padding:0;touch-action:none;cursor:grab;border-radius:12px}
.ud{display:flex;flex-direction:column}
.ud button{width:30px;height:22px;border:0;background:none;color:var(--muted);display:grid;place-items:center;padding:0;border-radius:8px}
.ud button:disabled{opacity:.25;cursor:default}
.trow.drag{position:relative;z-index:3;background:var(--surface);box-shadow:0 14px 30px -10px rgba(20,30,70,.45);border-radius:16px;transition:box-shadow .2s}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}

.mnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mnav h2{font-size:calc(17px*var(--fs,1));text-align:center;flex:1}
.mnav button{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.mnav button:disabled{opacity:.3;cursor:default}
.mread{font-weight:700;font-size:calc(14px*var(--fs,1));min-height:21px;text-align:center}
.mchart{position:relative;height:170px}
.mdays{display:grid;grid-template-columns:repeat(var(--nd),minmax(0,1fr));gap:3px;height:100%;touch-action:pan-y}
.mday{display:flex;flex-direction:column;justify-content:flex-end;gap:6px;height:100%;border:0;background:none;padding:0;min-width:0;cursor:pointer}
.mday .col{flex:1;display:flex;align-items:flex-end;width:100%}
.mday .col i{display:block;width:100%;height:0;border-radius:4px;background:var(--bar);min-height:3px;transition:height .9s var(--ease)}
.mday.z .col i{background:var(--track)}
.mday.hit .col i{background:var(--ok)}
.mday.today .col i{background:var(--accent)}
.mday.fut .col i{min-height:0;background:none}
.mday.sel .col i{outline:2px solid var(--ink);outline-offset:1px}
.mday span{display:flex;justify-content:center;white-space:nowrap;height:14px;font-size:calc(10.5px*var(--fs,1));color:var(--muted)}
.mday.today span{color:var(--ink);font-weight:700}
.gl{position:absolute;inset-inline:0;bottom:calc(20px + var(--g) * (100% - 20px));border-top:1.5px dashed var(--muted);opacity:.75;pointer-events:none}
.gl em{position:absolute;inset-inline-end:0;bottom:2px;font-style:normal;font-size:calc(10.5px*var(--fs,1));color:var(--muted);background:var(--surface);padding-inline:4px;border-radius:6px}
.mleg{display:flex;gap:14px;flex-wrap:wrap;font-size:calc(12px*var(--fs,1));color:var(--muted);align-items:center}
.mleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.dl{font-size:calc(12px*var(--fs,1));font-weight:700}
.dl.up{color:var(--ok)}
.dl.dn{color:var(--hot)}
.strow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:10px;border-top:1px solid var(--line)}
.strow:first-child{border-top:0}
.strow>span{flex:none}
.strow b{font-family:var(--f-display);font-weight:600;text-align:end}

/* segmented */
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));background:var(--track);border-radius:99px;padding:4px}
.seg .th{position:absolute;inset-block:4px;width:calc((100% - 8px)/var(--n));inset-inline-start:calc(4px + var(--i) * (100% - 8px)/var(--n));background:var(--surface);border-radius:99px;box-shadow:0 2px 10px -4px rgba(20,30,70,.35);transition:inset-inline-start .45s var(--spring)}
.seg button{position:relative;z-index:1;height:40px;border:0;background:none;border-radius:99px;font-weight:600;font-size:calc(14px*var(--fs,1));color:var(--muted)}
.seg button[aria-pressed=true]{color:var(--ink)}

/* subjects */
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.scard{border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--c) 14%,var(--surface));min-width:0;position:relative}
.scard .nm{font-family:var(--f-display);font-weight:600;font-size:calc(17px*var(--fs,1));line-height:1.25;overflow-wrap:anywhere}
.scard .bar{background:color-mix(in srgb,var(--c) 22%,transparent)}
.scard .bar>i{background:var(--c)}
.scard .del{align-self:flex-start;border:0;background:color-mix(in srgb,var(--c) 16%,transparent);border-radius:99px;padding:5px 12px;font-size:calc(12.5px*var(--fs,1));font-weight:600;color:var(--muted)}
.scard .del.on{background:var(--hot);color:#fff}

/* timer */
.focus{align-items:center;gap:18px;padding-block:24px}
.tring{position:relative;width:min(280px,100%);aspect-ratio:1}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring circle.p{transition:stroke-dashoffset .3s linear,stroke .4s}
.tring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tring .t{font-family:var(--f-display);font-size:calc(58px*var(--fs,1));font-weight:600;letter-spacing:-.03em;line-height:1}
.tring .m{font-size:calc(14px*var(--fs,1));color:var(--muted);font-weight:700}
.pills{display:flex;gap:8px;overflow-x:auto;max-width:100%;scrollbar-width:none;padding-block:2px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;height:38px;padding-inline:14px;display:flex;align-items:center;gap:8px;font-weight:500;font-size:calc(14px*var(--fs,1))}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.pill[aria-pressed=true]{background:color-mix(in srgb,var(--c) 18%,var(--surface));border-color:var(--c)}
.ctrl{display:flex;align-items:center;gap:22px}
.cb{width:54px;height:54px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.cb.main{width:84px;height:84px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 14px 28px -12px var(--accent)}
.cb.main svg{transition:transform .3s var(--spring)}

/* progress */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;height:170px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.day .col{width:100%;max-width:34px;flex:1;display:flex;align-items:flex-end}
.day .col i{display:block;width:100%;height:0;border-radius:10px;background:var(--bar);min-height:6px;transition:height .9s var(--ease)}
.day.today .col i{background:var(--accent)}
.day b{font-size:calc(11px*var(--fs,1));font-weight:600;min-height:16px}
.day span{font-size:calc(11.5px*var(--fs,1));color:var(--muted)}
.day.today span{color:var(--ink);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh)}
.kpi b{font-family:var(--f-display);font-size:calc(28px*var(--fs,1));font-weight:600;line-height:1.1}
.kpi span{font-size:calc(13px*var(--fs,1));color:var(--muted)}
.kpi.hot b{color:var(--hot)}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--track);gap:2px}
.stack i{display:block;height:100%;width:0;transition:width .9s var(--ease)}
.kchips{display:flex;gap:8px;flex-wrap:wrap}
.nowf{display:flex;flex-direction:column;gap:10px}
.nowf .btn{height:48px}
.ptiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pt{border:1.5px solid transparent;border-radius:16px;padding:10px 4px;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;font:inherit;font-size:calc(12px*var(--fs,1));font-weight:700;text-align:center;line-height:1.25;word-break:break-word}
.pt svg{color:var(--c)}
.pt[aria-pressed=true]{border-color:var(--c);box-shadow:0 0 0 2px var(--c)}
.nowc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:18px;background:var(--soft)}
.nowc b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--accent-text)}
.frform input.nowin{direction:auto;text-transform:none;letter-spacing:0}
.rdn{display:flex;align-items:center;gap:5px;margin-top:3px;font-size:calc(12.5px*var(--fs,1));font-weight:600;color:var(--accent-text)}
.rdn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg{display:flex;align-items:center;gap:10px;padding-block:6px}
.lg i{width:10px;height:10px;border-radius:50%;flex:none}

.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--soft);border-radius:18px;padding:12px 16px;font-size:calc(14px*var(--fs,1))}

/* nav */
.nav{position:fixed;inset-inline:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:10;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav .in{pointer-events:auto;position:relative;max-width:520px;margin-inline:auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;padding:6px;
  background:var(--surface);
  border:1px solid var(--line);border-radius:28px;box-shadow:0 6px 16px -10px rgba(20,30,90,.4)}
.nav .ind{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:22px;background:var(--soft);transition:transform .5s var(--spring),width .3s}
.nav button{position:relative;z-index:1;border:0;background:none;border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;color:var(--muted);font-size:calc(11.5px*var(--fs,1));font-weight:500}
.nav button[aria-current=page]{color:var(--accent-text)}
.nav button[aria-current=page] svg{transform:translateY(-1px) scale(1.1)}
.nav button svg{transition:transform .35s var(--spring)}

.fab{position:fixed;z-index:9;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  bottom:calc(98px + env(safe-area-inset-bottom,0px));inset-inline-end:max(16px,calc((100% - var(--w))/2 + 4px));
  box-shadow:0 16px 30px -12px var(--accent);transition:transform .4s var(--spring),opacity .25s}
.fab.hide{transform:scale(0) rotate(-90deg);opacity:0;pointer-events:none}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
.scrim.open{opacity:1;visibility:visible;transition-delay:0s}
.sheet{position:fixed;inset-inline:0;bottom:var(--kb,0px);z-index:21;max-width:560px;margin-inline:auto;max-height:min(90%,calc(var(--vvh,100vh) - 12px));overflow:auto;overscroll-behavior:contain;background:var(--surface);
  border-radius:30px 30px 0 0;padding-top:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  transform:translateY(105%);visibility:hidden;transition:transform .32s var(--ease),visibility 0s .32s}
.sheet.open{transform:none;visibility:visible;transition-delay:0s}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:calc(20px*var(--fs,1));margin-bottom:14px}
.sheet form{display:flex;flex-direction:column;gap:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:calc(13px*var(--fs,1));font-weight:700;color:var(--muted);min-width:0}

.btn{height:52px;border-radius:99px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:calc(16px*var(--fs,1));padding-inline:24px}

.sw button[aria-pressed=true] svg{opacity:1;transform:none}

/* subject parts + daily split */
details.opt{border:1.5px dashed var(--line);border-radius:18px;padding:12px 14px}
details.opt>summary{cursor:pointer;font-weight:700;font-size:calc(14px*var(--fs,1));color:var(--muted);list-style:none}

#parts{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.prow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;padding:10px;border-radius:16px;background:var(--bg)}
.prow .pn{grid-column:1/-1}
.prow input{height:44px;padding-inline:12px;background:var(--surface)}
.prow .px{width:44px;height:44px;border-radius:50%;border:0;background:var(--track);display:grid;place-items:center;padding:0}

.sprow{display:flex;gap:12px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.sprow:first-of-type{border-top:0}
.sprow .dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.sprow.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.sprow.done .big2{color:var(--muted);text-decoration:line-through}
.big2{font-family:var(--f-display);font-weight:600;font-size:calc(18px*var(--fs,1))}
.pchips{display:flex;flex-direction:column;gap:2px;font-size:calc(12px*var(--fs,1));color:var(--muted)}

/* profile */
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who>div{min-width:0;flex:1}
.who{flex:1}
.hdr .av{width:52px;height:52px;font-size:calc(20px*var(--fs,1))}
body>.wrap{padding-top:max(18px,calc(env(safe-area-inset-top,0px) + 10px))}
@media (display-mode:fullscreen){body>.wrap{padding-top:calc(env(safe-area-inset-top,0px) + 34px)}}
:root:fullscreen body>.wrap{padding-top:calc(env(safe-area-inset-top,0px) + 34px)}
.av{width:56px;height:56px;border-radius:50%;border:0;padding:0;overflow:hidden;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700;font-size:calc(22px*var(--fs,1));display:grid;place-items:center;flex:none;box-shadow:var(--sh)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.xl{width:104px;height:104px;font-size:calc(40px*var(--fs,1));cursor:default}
.pcenter{display:flex;flex-direction:column;align-items:center;gap:12px}
.prow2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.prow2 .btn{height:44px;font-size:calc(14px*var(--fs,1));padding-inline:18px;display:inline-flex;align-items:center;cursor:pointer}
input[type=file]{display:none}
input[type=time]{width:100%;min-width:0;height:50px;padding-inline:16px;border:1.5px solid transparent;border-radius:16px;background:var(--field,var(--bg));color:var(--ink);font-weight:500}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.sect{display:flex;flex-direction:column;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.sect h3{font-size:calc(15px*var(--fs,1))}
.sheet details.opt{margin-top:16px}
.pchip{display:flex;gap:8px;align-items:center;border:0;background:none;padding:3px 0;text-align:start;font-size:calc(12px*var(--fs,1));color:var(--muted);width:100%}
.pchip svg{flex:none;box-sizing:content-box;border:1.5px solid var(--muted);border-radius:50%;padding:2px;color:transparent;transition:all .25s}
.pchip.on svg{background:var(--ok);border-color:var(--ok);color:#fff}
.pchip.on span{text-decoration:line-through}
.toast{position:fixed;z-index:70;inset-inline:16px;top:calc(12px + env(safe-area-inset-top,0px));max-width:480px;margin-inline:auto;padding:14px 18px;border-radius:18px;background:var(--ink);color:var(--bg);font-weight:700;font-size:calc(15px*var(--fs,1));box-shadow:0 14px 34px -12px rgba(0,0,0,.5);opacity:0;transform:translateY(-16px);pointer-events:none;transition:opacity .3s,transform .35s var(--ease)}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toast .tundo{flex:none;border:0;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:calc(14px*var(--fs,1));height:36px;padding-inline:16px}
.pick{display:flex;flex-direction:column;gap:4px;text-align:start;border:1.5px solid var(--line);background:var(--bg);border-radius:20px;padding:16px;width:100%}
.pick b{font-family:var(--f-display);font-size:calc(17px*var(--fs,1))}
.pick span{font-size:calc(13px*var(--fs,1));color:var(--muted);font-weight:500}
.pick:hover{border-color:var(--accent)}
.rvprev{background:var(--soft);color:var(--accent-text);border-radius:16px;padding:12px 14px;font-weight:700;text-align:center;font-size:calc(15px*var(--fs,1))}
/* auth gate */
body.locked .wrap,body.locked .fab,body.locked .nav,body.locked .scrim,body.locked .sheet{display:none!important}
.auth{display:none;position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));align-items:center;justify-content:center}

.auth .top{display:flex;align-items:center;justify-content:space-between;gap:12px}

.auth form{display:flex;flex-direction:column;gap:14px}

.auth .note{font-size:calc(13px*var(--fs,1));color:var(--muted);text-align:center}
.auth .tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:99px;background:var(--track)}
.auth .tabs button{height:44px;border:0;border-radius:99px;background:none;font-weight:700;color:var(--muted)}
.auth .tabs button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
input[type=email],input[type=password]{width:100%;min-width:0;height:50px;padding-inline:16px;border:1.5px solid transparent;border-radius:16px;background:var(--field,var(--bg));color:var(--ink);font-weight:500;transition:border-color .25s,background .25s}
.auth input[type=email],.auth input[type=password]{background:var(--surface);border-color:var(--line)}
input[type=email]:focus,input[type=password]:focus{outline:none;border-color:var(--accent)}
.auth input[type=email],.auth input[type=password]{direction:ltr;text-align:start}

/* ---- entry screen + login popup ---- */
.auth .aufs{position:fixed;inset-block-start:max(16px,env(safe-area-inset-top,0px));inset-inline-start:16px;z-index:4;display:flex;gap:8px;direction:ltr}
.auth .aufs button{font-size:calc(15px*var(--fs,1))}.auth .aufs button:disabled{opacity:.35}
.auth .aulang{position:fixed;inset-block-start:max(16px,env(safe-area-inset-top,0px));inset-inline-end:16px;z-index:1}
.auth .intro{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;animation:rise .6s var(--ease) both}
.auth .logo{width:132px;height:132px;border-radius:28px;box-shadow:0 20px 44px -16px var(--accent);animation:splin .8s var(--spring) both}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.auth .brand2{font-size:calc(34px*var(--fs,1));line-height:1.1;letter-spacing:-.01em}
.auth .feats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.auth .feats span{display:inline-flex;align-items:center;gap:6px;height:36px;padding-inline:14px;border-radius:99px;background:var(--soft);color:var(--accent-text);font-weight:600;font-size:calc(13.5px*var(--fs,1))}
.auth .intro-b{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;margin-top:6px}
.auth .apscrim{position:fixed;inset:0;z-index:2;background:var(--scrim);opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
.auth .apscrim.open{opacity:1;visibility:visible;transition-delay:0s}
.auth .apop{position:fixed;inset-inline:0;bottom:var(--kb,0px);z-index:3;max-width:480px;max-height:min(92%,calc(var(--vvh,100vh) - 12px));overflow:auto;margin-inline:auto;display:flex;flex-direction:column;gap:16px;
  background:var(--surface);border-radius:30px 30px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -20px 50px -20px rgba(8,12,28,.55);
  transform:translateY(105%);visibility:hidden;transition:transform .32s var(--ease),visibility 0s .32s}
.auth .apop.open{transform:none;visibility:visible;transition-delay:0s}
.auth .aph{display:flex;align-items:center;justify-content:space-between;gap:12px}

@media (min-width:700px){
  .auth .apop{bottom:auto;top:50%;width:calc(100% - 48px);max-width:440px;border-radius:28px;opacity:0;transform:translateY(-44%) scale(.96);transition:transform .45s var(--ease),opacity .3s,visibility 0s .45s}
  .auth .apop.open{transform:translateY(-50%);opacity:1}}
.sbrand{display:none}
@media (hover:hover){
  .tile,.scard{transition:transform .25s var(--ease)}
  .tile:hover,.scard:hover{transform:translateY(-3px)}
  .nav button:hover{color:var(--ink)}

}
@media (min-width:600px){

}

  .hero,.banner,.seg,.kpis,.sgrid{grid-column:1/-1}
  .seg{max-width:440px}

  .sgrid{gap:16px}
  .nav{inset-inline:auto;inset-inline-start:0;top:0;bottom:0;width:264px;padding:24px 20px}
  .nav .in{max-width:none;margin:0;display:flex;flex-direction:column;gap:4px;padding:12px;height:100%;border-radius:28px;background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:var(--sh)}
  .sbrand{display:block;font-family:var(--f-display);font-size:calc(24px*var(--fs,1));font-weight:700;padding:14px 16px 20px;letter-spacing:-.01em;position:relative;z-index:1}
  .nav .ind{top:0;bottom:auto;border-radius:18px}

    transform:translateY(-46%) scale(.96);transition:transform .45s var(--ease),opacity .3s,visibility 0s .45s}

}
.nav button.navset{display:none}
@media (min-width:900px){.nav button.navset{display:flex;margin-top:auto}}
@media (min-width:1400px){:root{--w:1200px}.sgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:380px){.hero{flex-direction:column-reverse;align-items:flex-start}.hero .big{font-size:calc(46px*var(--fs,1))}}

}

.frform input{flex:1;min-width:0;height:46px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding-inline:16px;font:inherit;direction:ltr;text-transform:uppercase;letter-spacing:.08em}
.frform .btn{height:46px;padding-inline:20px;font-size:calc(14.5px*var(--fs,1))}
.frmsg{min-height:18px;font-size:calc(12.5px*var(--fs,1));font-weight:700;color:var(--hot)}
.frmsg.ok{color:var(--ok)}
.fr{display:flex;align-items:center;gap:12px;padding-block:11px;border-top:1px solid var(--line)}
.fr .fav{width:40px;height:40px;flex:none;border-radius:50%;background:var(--soft);color:var(--accent-text);display:grid;place-items:center;font-weight:700}
.fr .nm{font-weight:700;display:flex;align-items:center;gap:6px;min-width:0}
.fr .nm span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr .dot{width:8px;height:8px;flex:none;border-radius:50%;background:var(--ok)}
.fr .fs{display:flex;gap:12px;font-weight:700}
.fr .fs b{display:inline-flex;align-items:center;gap:4px}
.fr .fs b.fl{color:var(--hot)}
.fr .fs b.sh2{color:var(--accent-text)}
.fr.me{border-top:0;padding-top:2px}
.ngrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.nc{text-align:start;border:0;border-radius:18px;padding:12px;background:color-mix(in srgb,var(--c) 14%,var(--surface));border-inline-start:4px solid var(--c);color:var(--ink);display:flex;flex-direction:column;gap:6px;min-height:84px;font:inherit}
.nc b{font-size:calc(14px*var(--fs,1));display:flex;align-items:center;gap:6px}
.nc p{margin:0;font-size:calc(13px*var(--fs,1));color:var(--muted);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.sw2{display:flex;gap:8px;flex-wrap:wrap}
.sw2 .chip{border-color:var(--c);color:var(--ink)}
.ta{width:100%;min-height:110px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 14px;font:inherit;resize:vertical}


/* ---- menu smoothness ---- */
.nav .ind{transition:transform .5s cubic-bezier(.34,1.25,.5,1),width .4s var(--ios),height .4s var(--ios),background-color .25s}
.nav button{transition:color .3s var(--ios),transform .25s var(--ios),background-color .25s}
.nav button span{transition:opacity .3s var(--ios),transform .3s var(--ios)}
.nav button svg{transition:transform .45s cubic-bezier(.34,1.45,.5,1),color .3s var(--ios)}
.nav button:active:not(:disabled){transform:scale(.93)}
.nav button:not([aria-current=page]) span{opacity:.85}
.nav button[aria-current=page] span{opacity:1;font-weight:700}
@media (hover:hover){
  .nav button:not([aria-current=page]):hover{color:var(--ink)}
  .nav button:not([aria-current=page]):hover svg{transform:translateY(-2px) scale(1.06)}
}
@media (min-width:900px){
  .nav button{transition:color .3s var(--ios),transform .25s var(--ios),background-color .25s,padding-inline-start .3s var(--ios)}
  .nav button:not([aria-current=page]):hover{background:color-mix(in srgb,var(--soft) 45%,transparent)}
  .nav button:not([aria-current=page]):hover svg{transform:scale(1.08)}
}
#view.enter{animation:vfade .34s var(--ios) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#view.enter{animation:none}.nav button,.nav button svg,.nav .ind{transition:none}}
</style>

function partsTotal(sb){var h=0,l=0;(sb.parts||[]).forEach(function(p){h+=p.hours||0;l+=p.lec||0});return {h:h,l:l}}
function remH(sb){return Math.max(0,partsTotal(sb).h-(sb.doneH||0))}
function fmtH(h){return fmtMin(Math.round(h*60/5)*5)}
function dayShare(sb,days){
  if(sb.day&&sb.day.date===today())return sb.day.amt;
  var r=remH(sb);return r/Math.max(1,days)}
function partRow(p,i){
  p=p||{};

   '<label class="pl">'+t('partHours')+'<input type="number" class="pHours" min="0" max="500" step="0.5" value="'+(p.hours||'')+'" inputmode="decimal"></label>'+
   '<label class="pl">'+t('partLec')+'<input type="number" class="pLec" min="0" max="500" value="'+(p.lec||'')+'" inputmode="numeric"></label>'+
   '<button type="button" class="px" data-a="delpart" aria-label="×">'+ic('x',16)+'</button></div>'}

  var out=[];[].forEach.call(document.querySelectorAll('#parts .prow'),function(r,i){
    var h=parseFloat(r.querySelector('.pHours').value)||0,l=parseInt(r.querySelector('.pLec').value,10)||0;
    if(!(h>0)&&!(l>0))return;
    var nm=r.querySelector('.pName').value.trim()||(t('partDef')+' '+(out.length+1));
    out.push({id:r.getAttribute('data-pid')||uid(),name:nm,hours:Math.max(0,h),lec:Math.max(0,l),done:r.getAttribute('data-done')==='1'})});
  return out}
function splitCard(){
  var list=S.subjects.filter(function(x){return partsTotal(x).h>0});

  var days=Math.max(1,i.left),tot=0;
  var rows=list.map(function(x){

     '<div class="grow"><div style="font-weight:700">'+esc(x.name)+'</div><div class="small muted num">'+t('remaining')+': '+fmtH(r)+'</div></div>'+

function rollRv(){
  var ch=false,td=today();
  (S.reviews||[]).forEach(function(r){
    if(!r.chk){r.chk=td;r.dd=r.dd||{};if(r.day&&r.day.date)r.dd[r.day.date]=1;ch=true;return}
    r.dd=r.dd||{};
    var d=new Date(r.chk+'T00:00:00'),end=new Date(td+'T00:00:00');
    while(d<end){var k=dk(d);
      if(k>=r.start&&!r.dd[k]&&Math.max(0,r.hours-(r.doneH||0))>0)r.ext=(r.ext||0)+1;
      d.setDate(d.getDate()+1)}
    if(r.chk!==td){r.chk=td;ch=true}});
  if(ch)save()}

  return {left:Math.max(0,left),rem:rem,done:dn,share:dn?r.day.amt:Math.min(rem,rem/Math.max(1,left)),fin:rem<=0&&!dn,late:left<=0&&rem>0,el:el}}

/* ---------- monthly stats ---------- */
function monthStats(off){
  var now=new Date(),first=new Date(now.getFullYear(),now.getMonth()+off,1),y=first.getFullYear(),m=first.getMonth();
  var nd=new Date(y,m+1,0).getDate(),cur=off===0,elapsed=cur?now.getDate():nd,td=today(),goal=S.settings.goal||0;
  var lo=dk(first),hi=dk(new Date(y,m,nd)),by={},bySub={},sess=0;
  S.logs.forEach(function(l){if(l.date>=lo&&l.date<=hi){by[l.date]=(by[l.date]||0)+l.min;bySub[l.subj]=(bySub[l.subj]||0)+l.min;sess++}});
  var days=[],tot=0,max=0,act=0,gd=0,best=null,run=0,longest=0;
  for(var d=1;d<=nd;d++){
    var k=dk(new Date(y,m,d)),v=by[k]||0,o={k:k,d:d,m:v,fut:cur&&d>elapsed,t:k===td};days.push(o);
    tot+=v;if(v>max)max=v;
    if(v>0){act++;run++;if(run>longest)longest=run;if(!best||v>best.m)best=o}else run=0;
    if(goal>0&&v>=goal)gd++}
  var pnd=new Date(y,m,0).getDate(),lim=Math.min(elapsed,pnd),plo=dk(new Date(y,m-1,1)),phi=dk(new Date(y,m-1,lim)),prev=0;
  S.logs.forEach(function(l){if(l.date>=plo&&l.date<=phi)prev+=l.min});
  var early=null;S.logs.forEach(function(l){if(!early||l.date<early)early=l.date});
  var ey=early?+early.slice(0,4):now.getFullYear(),em=early?+early.slice(5,7)-1:now.getMonth();
  return {y:y,m:m,nd:nd,cur:cur,elapsed:elapsed,days:days,tot:tot,max:max,act:act,gd:gd,best:best,longest:longest,sess:sess,bySub:bySub,prev:prev,goal:goal,
    label:first.toLocaleDateString(loc(),{month:'long',year:'numeric'}),canPrev:(y*12+m)>(ey*12+em)}}
function daysW(n){return S.lang==='ar'?(n===2?'يومان':(n>=3&&n<=10)?'أيام':n===1?'يوم':'يومًا'):(n===1?'day':'days')}
function dayTxt(k,v){return new Date(k+'T00:00:00').toLocaleDateString(loc(),{weekday:'long',day:'numeric',month:'long'})+' · '+fmtMin(v)}
function mSel(k){
  UI.pd=k;var txt='';
  [].forEach.call(document.querySelectorAll('.mday'),function(b){var on=b.getAttribute('data-id')===k;b.classList.toggle('sel',on);if(on)txt=b.getAttribute('data-txt')});
  var r=document.getElementById('mRead');if(r&&txt)r.textContent=txt}
function progMonth(){
  var M=monthStats(UI.pm||0),scale=Math.max(M.max,M.goal,1),ar=S.lang==='ar';
  var sel=UI.pd&&M.days.some(function(x){return x.k===UI.pd&&!x.fut})?UI.pd:(M.cur?today():(M.best?M.best.k:''));
  var selD=M.days.filter(function(x){return x.k===sel})[0];
  var avg=M.elapsed?Math.round(M.tot/M.elapsed):0,delta='';
  if(M.prev>0){var pc=Math.round((M.tot-M.prev)/M.prev*100);delta='<small class="dl '+(pc>=0?'up':'dn')+'"><bdi dir="ltr" class="num">'+(pc>0?'\u25B2 ':pc<0?'\u25BC ':'')+Math.abs(pc)+'%</bdi> '+t('vsPrev')+'</small>'}
  var h='<div class="kpis"><div class="kpi rise" style="--d:'+(D++)+'"><b class="num" data-n="'+M.tot+'" data-k="kTot">0</b><span>'+t('min')+' · '+t('mTotal')+'</span>'+delta+'</div>'+
   '<div class="kpi rise" style="--d:'+(D++)+'"><b class="num" data-n="'+avg+'" data-k="kAvg">0</b><span>'+t('min')+' · '+t('avg')+'</span></div>'+
   '<div class="kpi rise" style="--d:'+(D++)+'"><b class="num" data-n="'+M.act+'" data-k="kAct" data-sfx="/'+M.elapsed+'">0</b><span>'+t('mActive')+'</span></div>'+
   '<div class="kpi rise" style="--d:'+(D++)+'"><b class="num" data-n="'+M.gd+'" data-k="kGd" data-sfx="/'+M.elapsed+'">0</b><span>'+t('mGoalDays')+'</span></div></div>';
  var lab=function(d){return d===1||(d%5===0&&d<=30)?d:''};
  h+=sec('','<div class="mnav"><button type="button" data-a="pmon" data-id="-1" aria-label="'+esc(t('mPrev'))+'"'+(M.canPrev?'':' disabled')+'>'+ic(ar?'chevR':'chevL',18)+'</button>'+
   '<h2>'+esc(M.label)+'</h2><button type="button" data-a="pmon" data-id="1" aria-label="'+esc(t('mNext'))+'"'+(UI.pm<0?'':' disabled')+'>'+ic(ar?'chevL':'chevR',18)+'</button></div>'+
   '<div class="mread num" id="mRead" aria-live="polite">'+(selD?dayTxt(selD.k,selD.m):'')+'</div>'+
   '<div class="mchart">'+(M.goal>0?'<div class="gl" style="--g:'+(M.goal/scale).toFixed(4)+'"><em class="num">'+t('mGoalLine')+' '+M.goal+'</em></div>':'')+
   '<div class="mdays" style="--nd:'+M.nd+'">'+M.days.map(function(x){
     var cls='mday'+(x.t?' today':'')+(x.fut?' fut':'')+(!x.fut&&!x.m?' z':'')+(M.goal>0&&x.m>=M.goal?' hit':'')+(x.k===sel?' sel':''),tx=dayTxt(x.k,x.m);
     return '<button type="button" class="'+cls+'" data-a="mbar" data-id="'+x.k+'" data-txt="'+esc(tx)+'" aria-label="'+esc(tx)+'"'+(x.fut?' disabled':'')+'><div class="col"><i data-h="'+(x.m?Math.round(x.m/scale*1000)/10:0)+'" data-k="mb'+x.d+'"></i></div><span class="num">'+lab(x.d)+'</span></button>'}).join('')+'</div></div>'+
   '<div class="mleg"><span><i style="background:var(--ok)"></i>'+t('mHit')+'</span><span>'+t('mHint')+'</span></div>');
  h+=sec('','<div class="sh"><h2>'+t('mDetails')+'</h2></div><div>'+
   '<div class="strow"><span class="muted">'+t('mBest')+'</span><b class="num">'+(M.best?fmtMin(M.best.m)+' · '+fmtDate(M.best.k):'—')+'</b></div>'+
   '<div class="strow"><span class="muted">'+t('mStreak')+'</span><b class="num">'+M.longest+' '+daysW(M.longest)+'</b></div>'+
   '<div class="strow"><span class="muted">'+t('mAvgStudy')+'</span><b class="num">'+(M.act?fmtMin(Math.round(M.tot/M.act)):'—')+'</b></div>'+
   '<div class="strow"><span class="muted">'+t('mSess')+'</span><b class="num">'+M.sess+'</b></div></div>');
  var rows=S.subjects.filter(function(x){return (M.bySub[x.id]||0)>0});
  h+=sec('','<div class="sh"><h2>'+t('perSubject')+'</h2></div>'+(M.tot&&rows.length?
    '<div class="stack">'+rows.map(function(x){return '<i style="background:'+x.color+'" data-w="'+Math.round(M.bySub[x.id]/M.tot*100)+'" data-k="st'+x.id+'"></i>'}).join('')+'</div>'+
    '<div>'+rows.map(function(x){var w=M.bySub[x.id];return '<div class="lg"><i style="background:'+x.color+'"></i><span class="grow">'+esc(x.name)+'</span><span class="muted small num">'+fmtMin(w)+' · '+Math.round(w/M.tot*100)+'%</span></div>'}).join('')+'</div>'
    :'<div class="empty">'+t('noTime')+'</div>'));
  return h}

function progWeek(){

    '<div>'+rows.map(function(s){var w=weekMins(s.id);return '<div class="lg"><i style="background:'+s.color+'"></i><span class="grow">'+esc(s.name)+'</span><span class="muted small num">'+fmtMin(w)+' · '+Math.round(w/tot*100)+'%</span></div>'}).join('')+'</div>'
    :'<div class="empty">'+t('noTime')+'</div>'));
  return h}

var KDB='mudhakirati-keys';
function b64(buf){var a=new Uint8Array(buf),r='';for(var i=0;i<a.length;i++)r+=String.fromCharCode(a[i]);return btoa(r)}

function idb(mode,fn){
  return new Promise(function(res,rej){
    var rq=indexedDB.open(KDB,1);
    rq.onupgradeneeded=function(){rq.result.createObjectStore('k')};
    rq.onerror=function(){rej(rq.error)};
    rq.onsuccess=function(){
      var db=rq.result,tx=db.transaction('k',mode),out=fn(tx.objectStore('k'));
      tx.oncomplete=function(){db.close();res(out&&out.result)};
      tx.onerror=tx.onabort=function(){db.close();rej(tx.error)}}})}
function sessKey(create){
  return idb('readonly',function(st){return st.get('sess')}).then(function(k){
    if(k||!create)return k||null;
    return crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']).then(function(nk){
      return idb('readwrite',function(st){return st.put(nk,'sess')}).then(function(){return nk})})})}
function saveSession(email){
  try{localStorage.removeItem(SESS_K)}catch(e){}   /* also wipes any old plaintext session */
  if(!sessOk())return Promise.resolve();
  var iv=crypto.getRandomValues(new Uint8Array(12));
  return sessKey(true).then(function(k){
    return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(JSON.stringify({e:email})))
  }).then(function(ct){
    localStorage.setItem(SESS_K,JSON.stringify({v:2,iv:b64(iv),ct:b64(ct)}))
  }).catch(function(){})}
function loadSession(){
  var raw='';try{raw=localStorage.getItem(SESS_K)||''}catch(e){}
  if(!raw)return Promise.resolve('');
  var o=null;try{o=JSON.parse(raw)}catch(e){}
  if(!o||o.v!==2)return Promise.resolve(raw);   /* old plaintext session: accepted once, enterApp re-saves it encrypted */
  if(!sessOk())return Promise.resolve('');
  return sessKey(false).then(function(k){
    if(!k)return '';
    return crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},k,unb64(o.ct)).then(function(pt){
      return JSON.parse(new TextDecoder().decode(pt)).e||''})

function openAuth(mode){
  clearTimeout(AUT);
  if(mode)AU.mode=mode;AU.err='';AU.ok=false;AU.open=false;authRender();AU.open=true;
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    [].forEach.call(document.querySelectorAll('.auth .apop,.auth .apscrim'),function(x){x.classList.add('open')});

function showAuth(){
  applyStoredTheme();document.body.classList.add('locked');AU.open=false;authRender();clearTimeout(AUT);
  AUT=setTimeout(function(){if(document.body.classList.contains('locked')&&!AU.open){if(AU.mode==='recover')openAuth('recover')}},250)}
function enterApp(email){
  if(SB&&SB.rtok){AU.mode='recover';showAuth();openAuth('recover');return}
  USER=email;AU.email='';AU.ok=false;saveSession(email);
  var raw=null;try{raw=JSON.parse(localStorage.getItem(KEY+':'+email)||'null')}catch(e){}
  var lang=S.lang;
  S=(raw&&raw.subjects)?migrate(raw):seed();if(!raw)S.lang=lang;
  if(!S.reviews)S.reviews=[];compactLogs();rollRv();
  if(S.subjects.length&&S.subjects.every(function(x){return x.ex})){S.subjects=[];S.tasks=S.tasks.filter(function(x){return !x.ex});S.logs=S.logs.filter(function(x){return !x.ex})}
  var trec=readTimer();   /* read before setMode() overwrites it with an idle timer */
  TM.running=false;setMode('focus');TM.subj=S.subjects[0]?S.subjects[0].id:'';
  if(trec){applyTimer(trec);swTimer()}
  UI.filter='open';UI.confirm='';UI.sheet='';regDaily();
  document.body.classList.remove('locked');closeSheet();
  window.scrollTo({top:0,behavior:'auto'});
  try{var qv=new URLSearchParams(location.search).get('view');if(qv&&VIEWS.indexOf(qv)>-1){S.view=qv;history.replaceState(null,'',location.pathname)}}catch(e){}
  render(true);setTimeout(function(){try{var q=frSync();if(q&&q.catch)q.catch(function(){})}catch(e){}},3500);
  if(S.onboarded===false){
    if(!S.subjects.length&&!S.tasks.length)setTimeout(function(){if(USER&&!UI.sheet)openSheet('welcome')},600);
    else{S.onboarded=true;save()}}}
/* logs older than 60 days are merged per day+subject: totals, streaks and monthly charts stay identical, storage stays small */
function compactLogs(){
  var cut=addDays(-60),keep=[],map={};
  S.logs.forEach(function(l){
    if(!(l.min>0))return;
    if(l.date<cut){var k=l.date+'|'+(l.subj||'');if(map[k]){map[k].min+=l.min;return}map[k]=l}
    keep.push(l)});
  if(keep.length!==S.logs.length)S.logs=keep}

function csvCell(v){
  v=v==null?'':String(v);
  if(/^[=+\-@\t\r]/.test(v)&&isNaN(Number(v)))v="'"+v;   /* stop spreadsheet formula injection */
  return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exCsv(tb,file){

function xmlE(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ---------- ICS calendar export ---------- */
function icsE(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n')}
function icsFold(l){   /* RFC 5545: lines are folded at 75 octets, never inside a character */
  var e=new TextEncoder(),o=[],c='',n=0;
  Array.from(l).forEach(function(ch){var b=e.encode(ch).length;if(n+b>74){o.push(c);c=' '+ch;n=1+b}else{c+=ch;n+=b}});
  o.push(c);return o.join('\r\n')}
function icsDay(k,plus){var d=new Date(k+'T00:00:00');d.setDate(d.getDate()+(plus||0));return dk(d).replace(/-/g,'')}
function exIcs(){
  var stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''),ev=[];
  S.tasks.forEach(function(k){
    if(k.done||!k.due)return;var s=subj(k.subj);
    ev.push(['BEGIN:VEVENT','UID:'+k.id+'@mudhakirati','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+icsDay(k.due),'DTEND;VALUE=DATE:'+icsDay(k.due,1),
      'SUMMARY:'+icsE((k.pri==='high'?'! ':'')+k.title),(s?'DESCRIPTION:'+icsE(s.name+' · '+t(k.pri||'med')):''),(s?'CATEGORIES:'+icsE(s.name):''),'TRANSP:TRANSPARENT',
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsE(k.title),'TRIGGER:PT9H','END:VALARM','END:VEVENT'].filter(Boolean))});
  var pl=planInfo();
  if(pl&&!pl.done){var ed=new Date(S.plan.start+'T00:00:00');ed.setDate(ed.getDate()+S.plan.days);var ek=dk(ed);
    ev.push(['BEGIN:VEVENT','UID:plan-'+S.plan.start+'@mudhakirati','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+icsDay(ek),'DTEND;VALUE=DATE:'+icsDay(ek,1),'SUMMARY:'+icsE(pl.name||t('planTitle')),'END:VEVENT'])}
  if(!ev.length){showToast(pkL('لا توجد مهام غير مكتملة بموعد لتصديرها','No incomplete tasks with a due date to export'));return}
  var lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mudhakirati//AR','CALSCALE:GREGORIAN','X-WR-CALNAME:'+icsE(t('app'))];
  ev.forEach(function(x){lines=lines.concat(x)});lines.push('END:VCALENDAR');
  dlFile('mudhakirati-'+today()+'.ics',lines.map(icsFold).join('\r\n')+'\r\n','text/calendar;charset=utf-8')}

    if(pv!==undefined&&n>pv){
      var msg='💬 '+(f.name||f.code)+(f.last?': '+f.last:'');
      if(document.hidden)notify(t('app'),msg,'msg-'+f.code);else{showToast(msg);try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}}}
    STK.un[f.code]=n});
  stkDotUpdate()}
document.addEventListener('click',function(e){
  var el=e.target.closest&&e.target.closest('[data-a]');if(!el)return;
  var a=el.getAttribute('data-a'),id=el.getAttribute('data-id');
  if(a==='msgopen'){
    var f=(FR.list||[]).filter(function(x){return x.code===id})[0];
    CH.code=id;CH.name=f?(f.name||f.code):id;openSheet('chat')}
  else if(a==='chq'){chSend(chQuick()[+id],'cheer')}
  else if(a==='chblock'){
    askConfirm(pkL('تحظر هذا الصديق؟ تنحذف الصداقة والرسائل، وما يكدر يضيفك مرة ثانية.','Block this friend? The friendship and messages are removed and they can’t add you again.'),{title:pkL('حظر','Block'),ok:pkL('حظر','Block'),cancel:pkL('إلغاء','Cancel'),danger:true}).then(function(y){
      if(!y)return;
      frRpc('block_friend',{p_code:CH.code}).catch(function(){}).then(function(){closeSheet();CH.code='';frLoad()})})}
});
document.addEventListener('input',function(e){if(e.target&&e.target.id==='chIn')UI.dirty=false});
document.addEventListener('submit',function(e){
  if(!e.target||e.target.id!=='fChat')return;e.preventDefault();
  var i=document.getElementById('chIn');if(!i)return;var v=i.value;i.value='';UI.dirty=false;chSend(v,'text');i.focus()});
setInterval(function(){if(UI.sheet==='chat'&&!document.hidden&&USER)chLoad()},5000);
loadSession().then(function(sess){var ok=sess&&getUsers()[sess];playIntro(false);if(ok)enterApp(sess);else showAuth()}).then(hideSplash,hideSplash);
})();
</script>
<script>
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
